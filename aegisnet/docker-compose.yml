version: "3.9"

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aegisnet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegisnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegisnet_secret}
      POSTGRES_DB: ${POSTGRES_DB:-aegisnet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegisnet}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Mosquitto MQTT Broker ────────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: aegisnet_mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Node.js Backend (REST + Socket.IO + MQTT bridge) ────────────────────────
  backend-node:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    container_name: aegisnet_backend_node
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aegisnet}:${POSTGRES_PASSWORD:-aegisnet_secret}@postgres:5432/${POSTGRES_DB:-aegisnet}
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      PORT: 4000
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  # ─── Python FastAPI AI / Correlation Service ──────────────────────────────────
  backend-ai:
    build:
      context: ./backend-ai
      dockerfile: Dockerfile
    container_name: aegisnet_backend_ai
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-aegisnet}:${POSTGRES_PASSWORD:-aegisnet_secret}@postgres:5432/${POSTGRES_DB:-aegisnet}
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # ─── React Frontend (Vite preview build) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aegisnet_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_SOCKET_URL: http://localhost:4000
    ports:
      - "3000:80"
    depends_on:
      - backend-node

volumes:
  postgres_data:
