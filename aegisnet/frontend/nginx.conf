server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API to backend (when both run in Docker Compose)
    location /api/ {
        proxy_pass http://backend-node:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy Socket.IO
    location /socket.io/ {
        proxy_pass http://backend-node:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
